spring:
  application:
    name: quantitymeasurment
####################################################
# Repository Configuration
####################################################

# Repository selection: CACHE or DATABASE
repository.type=DATABASE

####################################################
# H2 Database Configuration
####################################################

db.driver=org.h2.Driver
db.url=jdbc:h2:mem:quantitydb;DB_CLOSE_DELAY=-1
db.username=sa
db.password=

####################################################
# Connection Pool Configuration
####################################################

db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeoutMs=5000

####################################################
# Logging Configuration
####################################################

logging.level.root=INFO
logging.level.com.apps.quantitymeasurment=DEBUG
